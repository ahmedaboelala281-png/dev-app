name: Pull from ECR and Push to DockerHub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. إعداد بيانات الدخول لـ AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3

    # 2. تسجيل الدخول على AWS ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    # 3. سحب الصورة (Pull) من AWS ECR
    - name: Pull Image from ECR
      run: |
        docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-3.amazonaws.com/my-ecr-1:latest

    # 4. تسجيل الدخول على DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 5. إعادة تسمية (Tag) الصورة ورفعها لـ DockerHub
    - name: Tag and Push Image to DockerHub
      run: |
        docker tag ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-3.amazonaws.com/my-ecr-1:latest ${{ secrets.DOCKERHUB_USERNAME }}/my-ecr-1:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-ecr-1:latest